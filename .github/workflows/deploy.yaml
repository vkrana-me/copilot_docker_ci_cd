# github actions workflows to build and push docker image on push on main branch
name: Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Prepare image tag
        id: prep
        shell: bash
        run: |
          DOCKER_USERNAME="$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          DOCKER_TOKEN="$(echo "${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}" | tr -d '[:space:]')"
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is empty after trimming whitespace."
            exit 1
          fi
          if [ -z "$DOCKER_TOKEN" ]; then
            echo "Docker Hub token/password secret is empty. Set DOCKERHUB_TOKEN (recommended) or DOCKER_PASSWORD."
            exit 1
          fi
          echo "image=${DOCKER_USERNAME}/todo_app_froma_action:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.prep.outputs.image }}
